# A version tag (v1.2.0) builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Cutsona find it there and offer the update, with the notes from CHANGELOG.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Get FFmpeg and yt-dlp
        run: node desktop/fetch-tools.js
      - name: Build the installer and publish the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release title and notes from CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $esc = [regex]::Escape($v)
          $notes = ([regex]::Match($log, "(?ms)^##\s+v?$esc\b[^\n]*\n(.*?)(?=^##\s[^#]|\z)")).Groups[1].Value.Trim()
          $title = ([regex]::Match($log, "(?m)^##\s+v?$esc\b\s*[-:]?\s*(.*)$")).Groups[1].Value.Trim()
          $notes += "`n`n**Install:** download ``Cutsona-Setup-$v.exe`` below and open it."
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release edit "v$v" --title ("Cutsona $v" + $(if ($title) { " - $title" } else { '' })) --notes-file notes.md
